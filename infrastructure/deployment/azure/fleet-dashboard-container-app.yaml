# Fleet Dashboard Container App Configuration
properties:
  configuration:
    activeRevisionsMode: single
    ingress:
      external: true
      targetPort: 80
      allowInsecure: false
      traffic:
        - latestRevision: true
          weight: 100
    dapr:
      enabled: false
    registries:
      - server: kindmoss-6eac8399.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        passwordSecretRef: acr-password
  template:
    containers:
      - name: fleet-dashboard
        image: kindmoss-6eac8399.azurecr.io/fleet-dashboard:latest
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: NODE_ENV
            value: "production"
          - name: REACT_APP_AUTH_URL
            value: "https://robotfleet-auth.kindmoss-6eac8399.eastus.azurecontainerapps.io"
          - name: REACT_APP_API_URL
            value: "https://robotfleet-ai.kindmoss-6eac8399.eastus.azurecontainerapps.io"
          - name: APPLICATIONINSIGHTS_CONNECTION_STRING
            value: "{{ secrets.APPLICATION_INSIGHTS_CONNECTION_STRING }}"
        probes:
          - type: Liveness
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          - type: Readiness
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          - type: Startup
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
    scale:
      minReplicas: 1
      maxReplicas: 3
      rules:
        - name: http-scaling
          custom:
            type: http
            metadata:
              concurrentRequests: "10"
              concurrentRequestsPerInstance: "5"
  managedEnvironment: robot-fleet-env
tags:
  app: fleet-dashboard
  environment: production
  team: robot-fleet
