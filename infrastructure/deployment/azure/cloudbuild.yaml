steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/mujoco-sanitation-ai/mujoco-training/mujoco-simulation:latest', '.']
  
  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/mujoco-sanitation-ai/mujoco-training/mujoco-simulation:latest']
  
  # Test the image (optional)
  - name: 'us-central1-docker.pkg.dev/mujoco-sanitation-ai/mujoco-training/mujoco-simulation:latest'
    args: ['--help']
    entrypoint: 'python3'

images:
  - 'us-central1-docker.pkg.dev/mujoco-sanitation-ai/mujoco-training/mujoco-simulation:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
