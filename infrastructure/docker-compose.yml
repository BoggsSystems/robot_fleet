version: '3.8'

services:
  # Development Environment
  cottage-client:
    build:
      context: ../frontend/web/admin_dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_AUTH_URL=https://robotfleet-auth.kindmoss-6eac8399.eastus.azurecontainerapps.io
      - REACT_APP_API_URL=https://robotfleet-ai.kindmoss-6eac8399.eastus.azurecontainerapps.io

  fleet-admin:
    build:
      context: ../frontend/web/admin_dashboard
      dockerfile: Dockerfile
    ports:
      - "5174:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_AUTH_URL=https://robotfleet-auth.kindmoss-6eac8399.eastus.azurecontainerapps.io
      - REACT_APP_API_URL=https://robotfleet-ai.kindmoss-6eac8399.eastus.azurecontainerapps.io

  fleet-dashboard:
    build:
      context: ../frontend/web/fleet_dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_AUTH_URL=https://robotfleet-auth.kindmoss-6eac8399.eastus.azurecontainerapps.io
      - REACT_APP_API_URL=https://robotfleet-ai.kindmoss-6eac8399.eastus.azurecontainerapps.io

  # Backend Services
  robot-api:
    build:
      context: ../services/robot_api
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ../services/robot_api:/app
      - ../services/data:/app/data
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:///app/data/robots.db

  fleet-control:
    build:
      context: ../services/fleet_control
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ../services/fleet_control:/app
      - ../services/data:/app/data
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:///app/data/fleet.db

  auth-service:
    build:
      context: ../services/auth
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../services/auth:/app
      - ../services/data:/app/data
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:///app/data/auth.db
      - JWT_SECRET=your-secret-key-here

  # Infrastructure
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=robot_fleet
      - POSTGRES_USER=robot_fleet
      - POSTGRES_PASSWORD=robot_fleet_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
